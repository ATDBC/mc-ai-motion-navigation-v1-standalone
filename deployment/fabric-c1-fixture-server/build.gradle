import groovy.json.JsonOutput
import java.security.MessageDigest

plugins { id 'fabric-loom' version '1.6-SNAPSHOT' }

version = '0.1.0'
group = 'com.mc2p'
base { archivesName = 'mc2p-c1-fixture-server' }
repositories { maven { url = 'https://repo.huaweicloud.com/repository/maven/' }; mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21'
    mappings 'net.fabricmc:yarn:1.21+build.9:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.15.11'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.100.6+1.21'
}
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }

def repositoryRoot = projectDir.toPath().resolve('../..').normalize().toFile()
def provenanceDir = layout.buildDirectory.dir('provenance')
tasks.named('compileJava') {
    outputs.dir(provenanceDir)
    doFirst {
        def hashes = new TreeMap<String, String>()
        source.files.each { file ->
            def relative = repositoryRoot.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            hashes[relative] = MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
        }
        def classpathFiles = classpath.files.collect { file ->
            def digest = MessageDigest.getInstance('SHA-256')
            file.withInputStream { input ->
                byte[] buffer = new byte[1024 * 1024]
                int count
                while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
            }
            [path: repositoryRoot.toPath().relativize(file.toPath()).toString().replace('\\', '/'),
             size: file.length(), sha256: digest.digest().encodeHex().toString()]
        }
        def target = provenanceDir.get().file('mc2p-c1-fixture-sources.json').asFile
        target.parentFile.mkdirs()
        target.text = JsonOutput.toJson([schema_version: 'mc2p.c1-fixture-sources.v1',
            sources: hashes, classpath_files: classpathFiles])
    }
}
tasks.named('processResources') { dependsOn tasks.named('compileJava'); from(provenanceDir) }

tasks.register('exportServerLaunch') {
    dependsOn tasks.named('classes'), tasks.named('configureLaunch')
    doLast {
        def fileEvidence = { file ->
            [size: file.length(), sha256: MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()]
        }
        def relativeName = { file -> repositoryRoot.toPath().relativize(file.toPath()).toString().replace('\\', '/') }
        def launchConfig = net.fabricmc.loom.configuration.ide.RunConfig.runConfig(project, loom.runs.getByName('server'))
        def runtimeFiles = tasks.named('runServer').get().classpath.files.collect { file ->
            if (file.isDirectory()) {
                def members = new TreeMap<String, Object>()
                fileTree(file).files.each { member ->
                    members[file.toPath().relativize(member.toPath()).toString().replace('\\', '/')] = fileEvidence(member)
                }
                [kind: 'directory', path: relativeName(file), files: members]
            } else {
                [kind: 'jar', path: relativeName(file)] + fileEvidence(file)
            }
        }
        def result = [schema_version: 'mc2p.c1-fixture-launch.v1', main_class: launchConfig.mainClass,
            jvm_args: launchConfig.vmArgs, game_args: launchConfig.programArgs,
            environment: launchConfig.environmentVariables, classpath: runtimeFiles]
        def target = layout.buildDirectory.file('launch/server-launch.json').get().asFile
        target.parentFile.mkdirs()
        target.text = JsonOutput.toJson(result)
    }
}
